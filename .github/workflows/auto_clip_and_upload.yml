name: GTA 6 Auto Clipper Pipeline

on:
  workflow_dispatch:
  schedule:
    # Runs every 8 hours (3 times/day) in UTC
    - cron: "0 */8 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Deno for yt-dlp JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]" google-genai google-api-python-client google-auth-oauthlib

      - name: Create cookies.txt from GitHub Secret
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        shell: bash
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
            chmod 600 cookies.txt
          fi

      - name: Ensure history file exists
        shell: bash
        run: |
          if [ ! -f posted_history.json ]; then
            echo "[]" > posted_history.json
          fi

      - name: Run Clipper Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_YT_CHANNEL_IDS: ${{ secrets.SOURCE_YT_CHANNEL_IDS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Remove temporary cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --staged --quiet || git commit -m "chore: update posted_history.json"
          git push

      - name: Upload generated clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-clips
          path: downloads/*.mp4
          if-no-files-found: ignore
