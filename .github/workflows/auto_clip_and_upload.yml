name: Auto Clip & Upload GTA 6 Moments (4x Daily)

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clip-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp, FFmpeg, and Node (for YouTube extraction)
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Restore YouTube Cookies (Prevents Datacenter IP Blocks)
        if: env.YOUTUBE_COOKIES_B64 != ''
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: echo "$YOUTUBE_COOKIES_B64" | base64 -d > cookies.txt

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Auto Clipper & Uploader
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SOURCE_YT_CHANNEL_IDS: ${{ secrets.SOURCE_YT_CHANNEL_IDS }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Save Posted History to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Log uploaded GTA 6 clip" && git push)
